<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>版本自检</title>
<style>
body{font-family:Arial,sans-serif;padding:20px;background:#f8fafc;color:#333;}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin:12px 0;}
.ok{color:#16a34a;font-weight:bold;}
.no{color:#dc2626;font-weight:bold;}
h1{font-size:1.2rem;color:#2563eb;}
.r{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;}
</style>
</head>
<body>
<h1>PicStudio 部署自检</h1>
<div class="box">
  <div class="r"><span>① HTML 文件</span><span class="ok">v22 ✓</span></div>
  <div class="r"><span>② lab.v22.js 加载</span><span id="r2">检测中…</span></div>
  <div class="r"><span>③ 领口保护函数</span><span id="r3">待检测</span></div>
  <div class="r"><span>④ 规范裁剪函数</span><span id="r4">待检测</span></div>
</div>
<div class="box" id="errBox" style="display:none;background:#fef2f2;border-color:#fecaca;">
  <b>加载失败信息：</b><div id="errMsg" style="font-size:.85rem;word-break:break-all;"></div>
</div>
<script src="assets/js/lab.v22.js" onerror="document.getElementById('errBox').style.display='block';document.getElementById('errMsg').textContent='lab.v22.js 加载失败（404 或路径错误）';document.getElementById('r2').className='no';document.getElementById('r2').textContent='失败 ✗';"></script>
<script>
var r2=document.getElementById('r2');
var r3=document.getElementById('r3');
var r4=document.getElementById('r4');
if(window.Lab){
  r2.className='ok'; r2.textContent='成功 ✓';
  r3.className = (window.Lab.faceGuard) ? 'ok' : 'no';
  r3.textContent = (window.Lab.faceGuard) ? '有 ✓' : '没有 ✗';
  r4.className = (window.Lab.shrinkHQ) ? 'ok' : 'no';
  r4.textContent = (window.Lab.shrinkHQ) ? '有 ✓' : '没有 ✗';
}else{
  r2.className='no'; r2.textContent='未加载 ✗';
  r3.className='no'; r3.textContent='无法检测';
  r4.className='no'; r4.textContent='无法检测';
}
</script>
</body>
</html>
