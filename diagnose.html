<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>图片预览诊断 — PicStudio 临时排查页</title>
<style>
body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
padding:16px;line-height:1.7;margin:0}
h1{font-size:18px;color:#a78bfa;margin:0 0 6px}
.tip{background:#1e293b;border-left:3px solid #a78bfa;padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:16px}
input[type=file]{width:100%;padding:14px;background:#1e293b;border:2px dashed #475569;border-radius:10px;color:#e2e8f0;
font-size:14px;margin-bottom:16px}
#log{background:#020617;border:1px solid #334155;border-radius:8px;padding:12px;font-size:12px;
font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:200px}
.ok{color:#4ade80}.bad{color:#f87171}.warn{color:#fbbf24}.dim{color:#94a3b8}
#preview{margin-top:16px;text-align:center}
#preview img{max-width:100%;max-height:300px;border:1px solid #475569;border-radius:8px;display:none;margin:0 auto}
</style>
</head>
<body>
<h1>🔍 图片预览诊断</h1>
<div class="tip">这是<b>临时排查页</b>，不是正式功能。选一张你在别的问题页打不开的照片，把下面显示的内容<b>截图发我</b>。用完我会让你删掉。</div>

<input type="file" id="f" accept="image/*">

<div id="log">等待选择图片…</div>
<div id="preview"><img id="pv" alt="预览"></div>

<script>
var logEl=document.getElementById('log');
var pvEl=document.getElementById('pv');
function w(cls,txt){var s=document.createElement('span');s.className=cls||'';s.textContent=txt+'\n';logEl.appendChild(s);}

document.getElementById('f').addEventListener('change',function(e){
  var file=e.target.files[0];
  if(!file){w('bad','没有选中文件');return;}
  logEl.innerHTML='';
  w('','===== 文件信息 =====');
  w('','文件名: '+file.name);
  w('','MIME类型: '+(file.type||'(空)'));
  w('','文件大小: '+(file.size/1024/1024).toFixed(2)+' MB');
  var ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='heic'||ext==='heif'||/heic|heif/i.test(file.type)){
    w('bad','⚠️ 这是 HEIC/HEIF 格式！Chrome/大部分安卓浏览器无法解码。');
    w('bad','   请在手机相册里「导出/分享为 JPG」后再试。');
  }else{
    w('ok','格式看起来是浏览器支持的: '+ext);
  }
  w('','');
  w('','===== 浏览器能力 =====');
  w('','createImageBitmap 可用: '+(typeof createImageBitmap==='function'?'是':'否'));
  w('','URL.createObjectURL 可用: '+(typeof URL!=='undefined'&&URL.createObjectURL?'是':'否'));
  w('','UserAgent: '+navigator.userAgent.slice(0,90));
  w('','');
  w('','===== 方式1: objectURL =====');
  tryPreview(file);
});

function tryPreview(file){
  var t0=Date.now();
  var url;
  try{ url=URL.createObjectURL(file); }catch(err){ w('bad','创建失败: '+err.message); tryBitmap(file); return; }
  w('dim','objectURL 已创建: '+url.slice(0,40)+'…');
  var im=new Image();
  var done=false;
  im.onload=function(){
    if(done)return; done=true;
    w('ok','✅ objectURL 加载成功 ('+(Date.now()-t0)+'ms)');
    w('ok','   解码尺寸: '+im.naturalWidth+' × '+im.naturalHeight);
    if(im.naturalWidth===0||im.naturalHeight===0){ w('bad','   ⚠️ 尺寸为0，实际没解出来'); }
    pvEl.src=url; pvEl.style.display='block';
    probePixels(im);
  };
  im.onerror=function(){
    if(done)return; done=true;
    w('bad','❌ objectURL 加载失败 ('+(Date.now()-t0)+'ms)');
    w('dim','   → 尝试方式2');
    tryBitmap(file);
  };
  im.src=url;
  setTimeout(function(){
    if(!done){ w('warn','⏱ objectURL 超时未回调 (>'+(Date.now()-t0)+'ms)'); done=true; tryBitmap(file); }
  },8000);
}

function tryBitmap(file){
  w('','');
  w('','===== 方式2: createImageBitmap =====');
  if(typeof createImageBitmap!=='function'){ w('bad','不支持，跳过'); tryDataURL(file); return; }
  var t0=Date.now();
  createImageBitmap(file).then(function(bm){
    w('ok','✅ createImageBitmap 成功 ('+(Date.now()-t0)+'ms)');
    w('ok','   尺寸: '+bm.width+' × '+bm.height);
    tryDataURL(file);
  }).catch(function(err){
    w('bad','❌ createImageBitmap 失败: '+err.message);
    tryDataURL(file);
  });
}

function tryDataURL(file){
  w('','');
  w('','===== 方式3: dataURL (readAsDataURL) =====');
  var t0=Date.now();
  var r=new FileReader();
  r.onload=function(ev){
    w('ok','读取完成 ('+(Date.now()-t0)+'ms), 长度 '+ev.target.result.length);
    var im=new Image();
    im.onload=function(){
      w('ok','✅ dataURL 解码成功');
      w('ok','   尺寸: '+im.naturalWidth+' × '+im.naturalHeight);
      if(!pvEl.src||pvEl.style.display!=='block'){ pvEl.src=ev.target.result; pvEl.style.display='block'; }
      probePixels(im);
    };
    im.onerror=function(){ w('bad','❌ dataURL 解码失败'); };
    im.src=ev.target.result;
  };
  r.onerror=function(){ w('bad','❌ 文件读取失败'); };
  r.readAsDataURL(file);
}

function probePixels(im){
  setTimeout(function(){
    w('','');
    w('','===== 像素采样 =====');
    try{
      var c=document.createElement('canvas'); c.width=80; c.height=80;
      var x=c.getContext('2d'); x.drawImage(im,0,0,80,80);
      var d=x.getImageData(0,0,80,80).data;
      var r=0,g=0,b=0,n=0,black=0;
      for(var i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; if(d[i]<12&&d[i+1]<12&&d[i+2]<12)black++; }
      w('','平均色: rgb('+Math.round(r/n)+','+Math.round(g/n)+','+Math.round(b/n)+')');
      var bp=(black/n*100).toFixed(1);
      w(black/n>0.9?'bad':'ok','纯黑像素占比: '+bp+'%');
      if(black/n>0.9) w('bad','⚠️ 画出来几乎全黑 —— 这就是你看到的黑格！');
    }catch(err){ w('bad','像素采样失败: '+err.message); }
    w('','');
    w('dim','===== 诊断结束，请截图以上内容 =====');
  },300);
}
</script>
</body>
</html>
