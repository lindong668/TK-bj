<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滤镜美化 - PicStudio</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="../index.html" class="logo">
                <span class="logo-icon">🎨</span>
                <span class="logo-text">Pic<span class="accent">Studio</span></span>
            </a>
        </div>
    </header>

    <section class="tool-page">
        <div class="container">
            <a href="../index.html" class="back-link">← 返回首页</a>
            <div class="tool-header">
                <h1>🌈 滤镜美化</h1>
                <p>黑白、复古、冷调、暖调等多种滤镜一键应用</p>
            </div>

            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <div class="upload-text">点击或拖拽图片到这里</div>
                <div class="upload-hint">支持 PNG / JPG / WebP</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <div class="preview-area" id="previewArea">
                <div class="preview-box">
                    <h3>原始图片</h3>
                    <img id="originalPreview" src="" alt="原始图片">
                </div>
                <div class="preview-box">
                    <h3>滤镜效果</h3>
                    <img id="processedPreview" src="" alt="处理结果">
                </div>
            </div>

            <div class="controls" id="controls">
                <div class="control-group">
                    <label class="control-label">选择滤镜</label>
                    <select id="filterSelect">
                        <option value="grayscale">黑白</option>
                        <option value="sepia">复古棕调</option>
                        <option value="cool">冷色调</option>
                        <option value="warm">暖色调</option>
                        <option value="vintage">老照片</option>
                        <option value="invert">反色</option>
                        <option value="brightness">提亮</option>
                        <option value="contrast">高对比</option>
                        <option value="saturate">高饱和</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label">滤镜强度</label>
                    <input type="range" id="filterStrength" min="0" max="100" value="100">
                    <div class="control-hint" id="strengthHint">强度：100%</div>
                </div>

                <button class="btn btn-primary btn-lg" id="processBtn" style="width:100%;">应用滤镜</button>
            </div>

            <div class="download-section" id="downloadSection">
                <button class="btn btn-primary btn-lg" id="downloadBtn">⬇️ 下载结果</button>
            </div>
        </div>
    </section>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">正在处理中，请稍候...</div>
    </div>

    <script src="../assets/js/tools.js"></script>
    <script>
    const strengthSlider = document.getElementById('filterStrength');
    const strengthHint = document.getElementById('strengthHint');

    strengthSlider.addEventListener('input', () => {
        strengthHint.textContent = `强度：${strengthSlider.value}%`;
    });

    const tool = new ImageTool({
        process: async (canvas) => {
            const filter = document.getElementById('filterSelect').value;
            const strength = parseInt(strengthSlider.value) / 100;

            // Clone canvas
            const result = document.createElement('canvas');
            result.width = canvas.width;
            result.height = canvas.height;
            const ctx = result.getContext('2d');
            ctx.drawImage(canvas, 0, 0);

            const imageData = ctx.getImageData(0, 0, result.width, result.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                let nr, ng, nb;

                switch (filter) {
                    case 'grayscale':
                        const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                        nr = nr = ng = nb = gray;
                        break;

                    case 'sepia':
                        nr = 0.393 * r + 0.769 * g + 0.189 * b;
                        ng = 0.349 * r + 0.686 * g + 0.168 * b;
                        nb = 0.272 * r + 0.534 * g + 0.131 * b;
                        break;

                    case 'cool':
                        nr = r * 0.8;
                        ng = g * 0.95;
                        nb = b * 1.2;
                        break;

                    case 'warm':
                        nr = r * 1.2;
                        ng = g * 1.05;
                        nb = b * 0.8;
                        break;

                    case 'vintage':
                        nr = r * 0.9 + 20;
                        ng = g * 0.8 + 10;
                        nb = b * 0.6;
                        break;

                    case 'invert':
                        nr = 255 - r;
                        ng = 255 - g;
                        nb = 255 - b;
                        break;

                    case 'brightness':
                        nr = r * 1.3;
                        ng = g * 1.3;
                        nb = b * 1.3;
                        break;

                    case 'contrast':
                        const factor = 1.5;
                        nr = (r - 128) * factor + 128;
                        ng = (g - 128) * factor + 128;
                        nb = (b - 128) * factor + 128;
                        break;

                    case 'saturate':
                        const l = 0.299 * r + 0.587 * g + 0.114 * b;
                        const sat = 1.6;
                        nr = r * sat + l * (1 - sat);
                        ng = g * sat + l * (1 - sat);
                        nb = b * sat + l * (1 - sat);
                        break;
                }

                // Blend with original based on strength
                data[i] = Math.min(255, Math.max(0, r + (nr - r) * strength));
                data[i + 1] = Math.min(255, Math.max(0, g + (ng - g) * strength));
                data[i + 2] = Math.min(255, Math.max(0, b + (nb - b) * strength));
            }

            ctx.putImageData(imageData, 0, 0);
            return result;
        },
        downloadOptions: { filename: 'picstudio-filtered', format: 'png' }
    });

    document.getElementById('processBtn').addEventListener('click', () => tool.process());
    </script>
</body>
</html>
